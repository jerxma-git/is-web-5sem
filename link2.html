<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main page</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/link2.css">
    <script src="./js/loadTimeMetric.js"></script>
    <script src="./js/highlightCurrentLink.js"></script>
    <script src="./js/layoutGen.js"></script>
    <svg width="0" height="0" xmlns="http://www.w3.org/2000/svg">
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" id="star">
            <path d="M31.547 12a.848.848 0 00-.677-.577l-9.427-1.376-4.224-8.532a.847.847 0 00-1.516 0l-4.218 8.534-9.427 1.355a.847.847 0 00-.467 1.467l6.823 6.664-1.612 9.375a.847.847 0 001.23.893l8.428-4.434 8.432 4.432a.847.847 0 001.229-.894l-1.615-9.373 6.822-6.665a.845.845 0 00.214-.869z" />
        </symbol>
    </svg>
</head>

<body>
    <header class="header">
        <nav class="nav-bar">
            <a href="./link1.html" class="nav-bar__link"><span>link</span></a>
            <a href="./link2.html" class="nav-bar__link"><span>link</span></a>
            <a href="./link3.html" class="nav-bar__link"><span>link</span></a>
            <a href="./link4.html" class="nav-bar__link"><span>link</span></a>
        </nav>
        <img class="logo" src="./images/skull_logo.png" alt="">
    </header>
    <main class="main">
        <h1 class="title">А это реально пустая страница :]</h1>

        <form id="skull-creation-form" action="post" class="skull-creator">
            <div class="skull-creator__name-input">
                <label for="name">Как зовут костяна</label>
                <input type="text" name="name">    
            </div>
            <div class="skull-creator__coolness-input">
                <span>Крутость костяна</span>
                <div class="skull-creator__star-container">
                    <svg class="skull-creator__star skull-creator__star_inactive" width="32" height="32">
                        <use xlink:href="#star"></use>
                    </svg>
                    <svg class="skull-creator__star skull-creator__star_inactive" width="32" height="32">
                        <use xlink:href="#star"></use>
                    </svg>
                    <svg class="skull-creator__star skull-creator__star_inactive" width="32" height="32">
                        <use xlink:href="#star"></use>
                    </svg>
                    <svg class="skull-creator__star skull-creator__star_inactive" width="32" height="32">
                        <use xlink:href="#star"></use>
                    </svg>
                    <svg class="skull-creator__star skull-creator__star_inactive" width="32" height="32">
                        <use xlink:href="#star"></use>
                    </svg>
                </div>
                <input type="number" name="coolness">
            </div>
            <button type="submit">Создать</button>
        </form>
        <div class="skull-container">
            <div id="skull-grid" class="skull-container__skull-grid skull-grid">
                <div class="skull-grid__header">
                    <div class="skull-grid__column-name">#</div>
                    <div class="skull-grid__column-name">Имя костяна</div>
                    <div class="skull-grid__column-name">Крутость костяна</div>
                </div>
                <div class="skull-grid__body">
                    <!-- суда скелети -->
                </div>
            </div>
            <div class="skull-container__controls">
                <button class="skull-container__save-btn skull-container__save-btn_synced" disabled="true">Сохранено</button>
                <button class="skull-container__sync-btn">Загрузить сохраненных скелетов</button>              
                <button class="skull-container__reset-btn">Сбросить скелетив</button>              
            </div>
        </div>
        
    </main>
    <footer>
        <p>Some footer text</p>
    </footer>
</body>

</html>
